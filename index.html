<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Busuego - Portfolio</title>
    <!-- FontAwesome for the social media icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 50px 40px;
            border-radius: 24px;
            text-align: center;
            color: #ffffff;
            max-width: 440px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .tagline {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 30px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .social-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .icon-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 52px;
            height: 52px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: #ffffff;
            text-decoration: none;
            font-size: 22px;
            transition: all 0.2s ease-in-out;
        }
        .icon-btn:hover {
            background: #ffffff;
            color: #1a1a1a;
            border-color: #ffffff;
            transform: translateY(-2px);
        }
        .doc-buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
            width: 100%;
        }
        .pill-btn {
            display: block;
            width: 100%;
            max-width: 280px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 0;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
            letter-spacing: 0.5px;
        }
        .pill-btn:hover {
            background: #ffffff;
            color: #1a1a1a;
            border-color: #ffffff;
            transform: translateY(-2px);
        }
        footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <h1>John Busuego</h1>
        <div class="tagline">Operations Officer</div>
        
        <div class="social-row">
            <!-- Your Personal LinkedIn URL -->
            <a href="https://linkedin.com" target="_blank" class="icon-btn" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            <!-- Your Personal GitHub URL -->
            <a href="https://github.com" target="_blank" class="icon-btn" aria-label="GitHub"><i class="fab fa-github"></i></a>
        </div>
        
        <div class="doc-buttons">
            <!-- Leave this link placeholder as-is until your resume PDF URL is ready to swap in -->
            <a href="YOUR_RESUME_SHARE_LINK" target="_blank" class="pill-btn">View Resume</a>
        </div>
    </div>

    <footer>
        &copy; 2026 John Busuego
    </footer>

</body>
</html>
